{{ define "main" }}
<main class="mx-auto max-w-6xl px-6 py-12">
  <header class="mb-8">
    <h1 class="mb-4 text-4xl font-extrabold">{{ .Title }}</h1>
    <label class="sr-only" for="site-search-query">Search posts</label>
    <input id="site-search-query" type="search" placeholder="Search posts..." autocomplete="off" class="w-full rounded-md border border-neutral-300 bg-transparent px-4 py-3 dark:border-neutral-700">
  </header>
  <p id="site-search-status" class="mb-4 text-neutral-500 dark:text-neutral-400">Type to search all posts.</p>
  <div id="site-search-results" class="space-y-4"></div>
</main>
{{ $script := resources.Get "js/search-page.js" | resources.Minify | resources.Fingerprint }}
<script src="{{ $script.RelPermalink }}" data-index-url="{{ "index.json" | relURL }}" integrity="{{ $script.Data.Integrity }}" defer></script>
{{ end }}
